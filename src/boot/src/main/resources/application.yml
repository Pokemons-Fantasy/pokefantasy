spring:
  application:
    name: poke fantasy
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  mongodb:
    uri: ${MONGODB_URI:mongodb://root:password@localhost:27017/pokefantasy?authSource=admin}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
        readiness:
          include: mongo, redis, diskSpace
jwt:
  # Must be provided externally as a Base64-encoded 256-bit key
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
