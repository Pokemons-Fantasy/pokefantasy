spring:
  application:
    name: poke fantasy
  data:
    redis:
      host: localhost
      port: 6379
  mongodb:
    uri: mongodb://root:password@localhost:27017/pokefantasy?authSource=admin
server:
  port: 8080
jwt:
  # Must be provided externally as a Base64-encoded 256-bit key
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
