version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Replica set de un nodo: las transacciones multi-documento (MongoTransactionAdapter)
  # no están disponibles en un MongoDB standalone. Replica set + auth exige un keyFile.
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    healthcheck:
      # Inicia el replica set la primera vez; después solo comprueba su estado.
      test: >
        mongosh --quiet -u root -p password --authenticationDatabase admin --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - mongodb_data:/data/db

volumes:
  redis_data:
  mongodb_data:
