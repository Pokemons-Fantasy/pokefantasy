name: Compile and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
      - main

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and enforce coverage
        run: ./mvnw -B -ntp -f src/pom.xml clean verify

      # La genera OpenApiIntegrationTest: sirve para generar el cliente TypeScript del frontend.
      - name: Upload OpenAPI spec
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: src/boot/target/openapi.json
          if-no-files-found: warn

  # Render despliega con este Dockerfile: si deja de construir, que falle aquí y no en el deploy.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pokefantasy:ci .

  # Cada push a main es una versión: si la del POM aún no tiene release, la crea (etiqueta vX.Y.Z) tras pasar la CI.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('src/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::warning::main ha cambiado sin subir la versión del POM: v$version ya tiene release."
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          fi

  # Tras cada push a main (versión o hotfix), abre el PR de vuelta a develop: sin él, el siguiente PR de develop
  # a main sale desactualizado (falta el merge commit de main) y un hotfix no llegaría a develop.
  # El PR sale de una rama sync/vX.Y.Z-<sha> en este commit y no de main: si develop avanza antes del merge,
  # "Update branch" actualiza esa rama (main está protegida) y, como lo empuja una persona, lanza la CI.
  # Lo abre el token de Actions y no lanza la CI, pero sus checks son los de este commit de main, ya en verde.
  # Un PR de sync anterior aún abierto se cierra: el nuevo ya lo incluye.
  sync-develop:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Open sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          branch="sync/v$VERSION-${GITHUB_SHA::7}"
          if [ "$(gh api "repos/$GH_REPO/compare/develop...$GITHUB_SHA" --jq .ahead_by)" = "0" ]; then
            echo "develop ya tiene todo lo de main."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "El PR de $branch ya existe."
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" > /dev/null 2>&1 || echo "La rama $branch ya existe."
          url=$(gh pr create --base develop --head "$branch" --title "chore: sync v$VERSION de main a develop" \
            --body "Abierto por la CI tras el push a \`main\` (v$VERSION). Lleva a \`develop\` lo que solo está en \`main\`: el merge commit de la versión o un hotfix. Mergear con **merge commit** (ni squash ni rebase). Si sale desactualizado, pulsar \"Update branch\" y esperar a la CI.")
          echo "$url"
          for n in $(gh pr list --base develop --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"sync/\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$n" --comment "Sustituido por $url, que ya incluye este commit de main."
          done
