name: Compile and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and enforce coverage
        run: ./mvnw -B -ntp -f src/pom.xml clean verify

  # Render despliega con este Dockerfile: si deja de construir, que falle aquí y no en el deploy.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pokefantasy:ci .
