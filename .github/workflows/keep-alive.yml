name: Keep Render alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up Render service
        run: |
          echo "Pinging health endpoint..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --connect-timeout 10 \
              https://pokefantasy.onrender.com/actuator/health)
            echo "Attempt $i — status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Service is up."
              exit 0
            fi
            echo "Not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "Service did not respond after 3 attempts — may still be booting."
          exit 0
