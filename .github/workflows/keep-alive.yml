name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with retry)
        run: |
          for i in 1 2 3; do
            if curl -sf https://pokefantasy.onrender.com/actuator/health; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All retries failed"
          exit 1
